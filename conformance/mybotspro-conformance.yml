generated: '2026-08-14'
method: probed
source: >-
  live probes of auth.mybots.pro, client.mybots.pro, notification.mybots.pro,
  app.mybots.pro, mia.mybots.pro and mybots.pro
note: >-
  Every entry below is anchored to something observed on a live response or read from a
  document myBots serves. No standard is asserted from marketing copy. This file also
  carries the FULL negative contract-discovery record, so a later run does not repeat it.
standards:
- id: oauth2
  conforms: true
  evidence: >-
    Live OAuth 2.0 authorization server at https://auth.mybots.pro/ with authorize/token/
    introspect endpoints; token endpoint returns RFC 6749 §5.2 error objects
    ({"error":"invalid_request","error_description":...}).
- id: oidc
  conforms: true
  evidence: >-
    /.well-known/openid-configuration returns 200 with issuer, authorization_endpoint,
    token_endpoint, userinfo_endpoint, jwks_uri, response_types_supported and
    id_token_signing_alg_values_supported (RS256).
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: /.well-known/oauth-authorization-server returns 200 with the same metadata document.
- id: rfc7636-pkce
  conforms: partial
  evidence: >-
    code_challenge_methods_supported is [plain, S256]. S256 is present, but advertising
    `plain` is discouraged by RFC 7636 §7.2 and disallowed by OAuth 2.1.
- id: rfc9068-jwt-access-tokens
  conforms: unknown
  evidence: >-
    Cannot be established anonymously — issuing a token requires client credentials that
    are not publicly obtainable.
- id: rfc9728-oauth-protected-resource-metadata
  conforms: false
  evidence: >-
    /.well-known/oauth-protected-resource returns 404 on auth.mybots.pro,
    client.mybots.pro and notification.mybots.pro. An MCP client cannot discover the
    resource server from the API host.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Observed error body is a bespoke envelope {"status":"not_found","message":"..."} with
    content-type application/json, not application/problem+json.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on every host that serves honest statuses.
- id: rfc8615-well-known-uris
  conforms: partial
  evidence: >-
    auth.mybots.pro serves standard well-known URIs correctly. However the advertised
    jwks_uri is /.well-known/jwks, which is not the registered suffix, and
    /.well-known/jwks.json 404s.
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header observed on any response; no deprecation policy published.
- id: openapi
  conforms: false
  evidence: See contract_discovery below — no OpenAPI document exists on any myBots host.
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document and no published event/webhook catalog.
- id: graphql
  conforms: false
  evidence: POST to /graphql on app. and mia.mybots.pro returns nginx 405 Not Allowed.
- id: mcp
  conforms: false
  evidence: POST tools/list to /mcp on app. and mia.mybots.pro returns nginx 405 Not Allowed.
- id: a2a
  conforms: false
  evidence: >-
    /.well-known/agent-card.json and /.well-known/agent.json 404 on every host that serves
    honest statuses; on mybots.pro they return the SPA HTML shell, which is not a card.
- id: api-versioning-header
  conforms: true
  evidence: >-
    notification.mybots.pro returns `api-supported-versions: 1.0` (ASP.NET API Versioning,
    the header from the Microsoft REST API Guidelines lineage).
- id: hsts
  conforms: true
  evidence: strict-transport-security max-age=31536000 observed on mybots.pro, client. and notification.
