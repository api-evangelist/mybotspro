aid: mybotspro
name: Mybots.pro
description: >-
  myBots (operated by Global AI Group, Inc.) builds enterprise AI sales and
  support agents for messaging channels — WhatsApp, Instagram, Telegram, LinkedIn
  and web chat, under the Mia AI product name. Each agent qualifies inbound leads,
  answers questions from the business's own knowledge base in its brand voice,
  books appointments on a connected calendar, recommends products from a live
  catalog, and syncs contacts and deals to HubSpot, Bitrix, Pipedrive, amoCRM or
  Google Sheets. It is a no-developer SaaS aimed at business teams, priced per
  message rather than per seat. myBots publishes no developer portal, no API
  reference and no machine-readable API specification of any kind — no OpenAPI,
  AsyncAPI, GraphQL SDL, Postman collection, MCP server or A2A agent card exists
  on any of its hosts. It does run real, reachable API infrastructure behind the
  product: a live OAuth 2.0 / OpenID Connect authorization server at
  auth.mybots.pro that serves complete anonymous discovery metadata, a
  bearer-gated tenant API at client.mybots.pro, and one anonymous public
  operation at notification.mybots.pro that configures the embeddable web-chat
  widget. Surfaced as a portfolio company of 500 Global and added to the API
  Evangelist network.
