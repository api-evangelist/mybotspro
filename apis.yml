apis:
- name: myBots Identity (OAuth 2.0 / OpenID Connect)
  description: >-
    The myBots identity provider, running OpenIddict. This is the only surface in the
    estate that publishes a complete, anonymous, machine-readable contract: RFC 8414
    authorization-server metadata and an OpenID Connect discovery document, both live at
    /.well-known/. It issues the bearer tokens the tenant API requires, advertising the
    authorization_code, client_credentials, password and refresh_token grants plus two
    non-standard grants (verification_token, session_token), with PKCE S256 supported.
  humanURL: https://mybots.pro
  baseURL: https://auth.mybots.pro
  tags:
  - Authentication
  - OAuth
  - OpenID Connect
  properties:
  - type: OpenIDConnect
    url: https://auth.mybots.pro/.well-known/openid-configuration
  - type: Authentication
    url: authentication/mybotspro-authentication.yml
  - type: OAuthScopes
    url: scopes/mybotspro-scopes.yml
  - type: WellKnown
    url: well-known/mybotspro-well-known.yml
- name: myBots Web Chat Public API
  description: >-
    The anonymous configuration API behind the embeddable Mia AI web-chat widget. A single
    published operation, GET /api/IntegrationApp/public/webchat/{channel}/config, returns
    the launcher accent color, launcher icon and a short-lived handshake token for a
    channel public key. It takes no credentials — the caller is authorized by a per-channel
    domain allow-list matched against the embedding page origin. Documented only inside the
    provider's own widget loader script; there is no reference page for it.
  humanURL: https://mybots.pro
  baseURL: https://notification.mybots.pro
  tags:
  - Web Chat
  - Embeddable
  - Widget
  properties:
  - type: Components
    url: components/mybotspro-components.yml
  - type: Conventions
    url: conventions/mybotspro-conventions.yml
  - type: ErrorCatalog
    url: errors/mybotspro-problem-types.yml
- name: myBots Tenant API
  description: >-
    The bearer-gated REST API the Mia AI application calls to operate a tenant's agents,
    subscription and channels. Confirmed live — /api/Subscribe/program answers HTTP 401
    with www-authenticate: Bearer, and an anonymous health endpoint reports MongoDB and
    Redis dependencies as healthy. No specification, operation list, reference page or
    credential-issuance path is published for it, so it is recorded as an existing but
    undocumented surface rather than a consumable API.
  humanURL: https://mybots.pro
  baseURL: https://client.mybots.pro
  tags:
  - Agents
  - Messaging
  - Subscription
  properties:
  - type: Authentication
    url: authentication/mybotspro-authentication.yml
  - type: ErrorCatalog
    url: errors/mybotspro-problem-types.yml
