  scheme: header
  header: api-supported-versions
  current: '1.0'
  in_path: false
  docs: null
  evidence:
    url: https://notification.mybots.pro/api/IntegrationApp/public/webchat/{channel}/config
    http_status: 404
    header: 'api-supported-versions: 1.0'
    observed: '2026-08-14'
  note: >-
    ASP.NET API Versioning is enabled and reports a single supported version, 1.0. Since no
    version appears in the route, a breaking change would have to be signalled through this
    header — with no published policy telling a client to read it.
