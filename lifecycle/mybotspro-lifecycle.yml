  note: >-
    No status page exists. status.mybots.pro resolves only because *.mybots.pro is a
    wildcard record; the TLS certificate covers just app.mybots.pro and mia.mybots.pro, so
    the name does not serve. No StatusPage pointer is emitted.
  health_endpoints:
  - url: https://client.mybots.pro/health
    status: 200
    body: '{"status":"Healthy","entries":{"mongodb":...,"RedisConnectionCheck":...,"client-resource":...}}'
  - url: https://notification.mybots.pro/health
    status: 200
  health_note: >-
    Both API hosts expose an anonymous ASP.NET Core health-check endpoint that reports
    per-dependency status. These are the closest thing to public availability signal myBots
    offers — undocumented, and arguably over-shared: they disclose the backing stack
    (MongoDB, Redis) and named internal health checks to any anonymous caller.
