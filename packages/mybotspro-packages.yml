note: >-
  myBots ships NO client SDK in any language. Every public registry was queried directly
  and every candidate name 404s. The single first-party distributable is the web-chat
  widget loader, which is a browser script served from the provider's own origin — not a
  client library for an API. It is listed here for completeness with official: true, but
  NO `SDKs` pointer is emitted in apis.yml for this provider, because crediting a chat
  widget as an API SDK would be false credit on the sdk_count check.
